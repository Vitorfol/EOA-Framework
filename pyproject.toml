[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eoa"
version = "0.1.0"
description = "Explanation-Oriented Agents: A modular framework for explainable AI in diverse systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vitor Fontenele & Elcio Costa & Murilo Coelho & Paulo Maia" },
]
keywords = [
    "xai",
    "multi-agent",
    "llm",
    "software-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies: strictly lightweight
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=0.1.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "eoa[gemini,test]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eoa"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "integration: live API integration tests requiring external credentials",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "PoC",
    ".venv",
    "examples",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []
